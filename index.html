<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TongueCheck AI - วิเคราะห์สุขภาพลิ้น</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --main-blue: #0056b3; --accent-yellow: #ffc107; --bg: #f8f9fa; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); }
        .navbar { background-color: var(--main-blue) !important; border-bottom: 3px solid var(--accent-yellow); }
        .card { border-radius: 20px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .btn-round { border-radius: 50px; font-weight: bold; }
        
        /* AI Chatbot UI */
        #chat-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; z-index: 1000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #chat-window { position: fixed; bottom: 90px; right: 20px; width: 320px; height: 450px; z-index: 1000; display: none; flex-direction: column; background: white; border-radius: 15px; border: 1px solid #ddd; overflow: hidden; }
        #chat-msgs { flex-grow: 1; overflow-y: auto; padding: 15px; background: #fdfdfd; display: flex; flex-direction: column; }
        .ai-msg { background: #e7f3ff; color: #004085; padding: 10px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; align-self: flex-start; font-size: 0.9rem; }
        .user-msg { background: var(--main-blue); color: white; padding: 10px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; align-self: flex-end; font-size: 0.9rem; }
        
        /* Scanner Area */
        #video { width: 100%; max-width: 400px; border-radius: 15px; border: 4px solid white; background: #000; }
        .overlay-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 180px; border: 2px dashed var(--accent-yellow); border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow mb-4">
    <div class="container justify-content-center">
        <span class="navbar-brand fw-bold">👅 TongueCheck AI</span>
    </div>
</nav>

<div class="container pb-5">
    <div id="authSection" class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="card p-4 text-center">
                <h4 class="fw-bold mb-3">เข้าสู่ระบบ</h4>
                <input type="email" id="email" class="form-control mb-2 btn-round" placeholder="อีเมล">
                <input type="password" id="password" class="form-control mb-3 btn-round" placeholder="รหัสผ่าน">
                <button class="btn btn-primary w-100 btn-round py-2 mb-2" onclick="login()">เข้าสู่ระบบ</button>
                <button class="btn btn-outline-secondary w-100 btn-round" onclick="signup()">สมัครสมาชิกใหม่</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="d-none animate__animated animate__fadeIn">
        <div class="row justify-content-center text-center">
            <div class="col-md-6">
                <div class="card p-3 mb-4">
                    <div class="position-relative d-inline-block">
                        <video id="video" autoplay playsinline></video>
                        <div class="overlay-circle"></div>
                    </div>
                    <button class="btn btn-danger btn-round mt-3 shadow px-5" onclick="scanTongue()">วิเคราะห์สุขภาพลิ้น</button>
                    <canvas id="canvas" class="d-none" width="400" height="300"></canvas>
                    <div id="scanResult" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="chat-btn" class="btn btn-primary" onclick="toggleChat()">🤖</div>
<div id="chat-window" class="shadow-lg animate__animated animate__fadeInUp">
    <div class="p-3 bg-primary text-white d-flex justify-content-between align-items-center">
        <span class="fw-bold">หมอลิ้น AI (Chatbot)</span>
        <button class="btn-close btn-close-white" onclick="toggleChat()"></button>
    </div>
    <div id="chat-msgs">
        <div class="ai-msg">สวัสดีครับ! สอบถามเรื่องลิ้นได้เลย เช่น "ฝ้าขาวคืออะไร?" หรือ "แปรงลิ้นยังไง?"</div>
    </div>
    <div class="p-2 border-top">
        <div class="input-group">
            <input type="text" id="chatIn" class="form-control" placeholder="พิมพ์คำถาม..." onkeypress="if(event.key==='Enter') askAI()">
            <button class="btn btn-primary" onclick="askAI()">ส่ง</button>
        </div>
    </div>
</div>

<script type="module">
    // --- Firebase Setup ด้วย Config ของคุณ ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAT_a_mJqgA4BpJAHsdnFG8DbitAWUoLko",
        authDomain: "tonguecheck.firebaseapp.com",
        databaseURL: "https://tonguecheck-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tonguecheck",
        storageBucket: "tonguecheck.firebasestorage.app",
        messagingSenderId: "278288057340",
        appId: "1:278288057340:web:dcc14f73fa8806c0176879",
        measurementId: "G-0DTTRQMXCK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- AI Knowledge Base ---
    const aiResponses = {
        "ฝ้าขาว": "ฝ้าขาวบนลิ้นมักเกิดจากการสะสมของแบคทีเรียและเศษอาหาร แนะนำให้ใช้ที่ขูดลิ้นและดื่มน้ำมากๆ ครับ",
        "ลิ้นแดง": "ลิ้นแดงจัดอาจเกิดจากอาการร้อนใน หรือขาดวิตามินบี ควรพักผ่อนและเลี่ยงอาหารรสจัดนะครับ",
        "แปรงลิ้น": "ควรแปรงลิ้นวันละ 2 ครั้งเพื่อลดกลิ่นปากได้ถึง 70% โดยเริ่มจากโคนลิ้นออกมาที่ปลายลิ้นครับ",
        "สวัสดี": "สวัสดีครับ! ผมเป็น AI ผู้ช่วยตรวจสุขภาพลิ้น มีอะไรให้ช่วยเหลือสอบถามได้เลย"
    };

    // --- Auth Logic ---
    window.login = () => signInWithEmailAndPassword(auth, email.value, password.value).catch(e => alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง"));
    window.signup = () => createUserWithEmailAndPassword(auth, email.value, password.value).then(() => alert("สมัครสมาชิกสำเร็จ!")).catch(e => alert(e.message));

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('authSection').classList.add('d-none');
            document.getElementById('mainSection').classList.remove('d-none');
            startCamera();
        }
    });

    // --- Camera & AI Scan ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = stream;
        } catch (err) { alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึง"); }
    }

    window.scanTongue = () => {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // จำลองการวิเคราะห์ค่าสี (RGB Analysis)
        const pixels = ctx.getImageData(150, 100, 100, 100).data;
        let r=0, g=0, b=0;
        for(let i=0; i<pixels.length; i+=4) { r+=pixels[i]; g+=pixels[i+1]; b+=pixels[i+2]; }
        const avgG = g/(pixels.length/4);

        let status = "";
        let advice = "";
        if(avgG > 165) {
            status = "พบสัญญาณฝ้าขาว (White Coating)";
            advice = "ควรทำความสะอาดลิ้นและดื่มน้ำเพิ่มขึ้น";
        } else {
            status = "สุขภาพลิ้นปกติ (Healthy)";
            advice = "ลิ้นของคุณดูสุขภาพดี รักษาความสะอาดต่อไปนะครับ";
        }

        document.getElementById('scanResult').innerHTML = `
            <div class="alert alert-${avgG > 165 ? 'warning' : 'success'} animate__animated animate__pulse">
                <h5 class="fw-bold">${status}</h5>
                <p class="mb-0 small">${advice}</p>
            </div>
        `;

        // บันทึกประวัติลง Database
        push(ref(db, `users/${auth.currentUser.uid}/history`), { date: new Date().toLocaleString(), result: status });
    };

    // --- Chatbot Logic ---
    window.toggleChat = () => {
        const win = document.getElementById('chat-window');
        win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
    };

    window.askAI = () => {
        const input = document.getElementById('chatIn');
        const box = document.getElementById('chat-msgs');
        if(!input.value) return;

        box.innerHTML += `<div class="user-msg">${input.value}</div>`;
        let response = "ขออภัยครับ ผมยังไม่มีข้อมูลส่วนนี้ ลองถามเกี่ยวกับ 'ฝ้าขาว' หรือ 'วิธีแปรงลิ้น' ดูนะครับ";
        
        for(let key in aiResponses) {
            if(input.value.includes(key)) { response = aiResponses[key]; break; }
        }

        setTimeout(() => {
            box.innerHTML += `<div class="ai-msg">${response}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 500);
        input.value = "";
    };
</script>
</body>
</html>
