<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TongueCheck Pro - AI & History Tracker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --p-blue: #0056b3; --a-yellow: #ffc107; --bg: #f4f7f6; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); }
        .navbar { background: var(--p-blue) !important; border-bottom: 4px solid var(--a-yellow); }
        .card { border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s; }
        .btn-round { border-radius: 50px; font-weight: bold; padding: 10px 25px; }
        
        /* Camera & Analysis UI */
        #video-container { position: relative; width: 100%; max-width: 450px; margin: auto; border-radius: 25px; overflow: hidden; border: 6px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        #video { width: 100%; background: #000; transform: scaleX(-1); }
        #video.back-cam { transform: scaleX(1); }
        .scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 160px; height: 200px; border: 3px dashed var(--a-yellow); border-radius: 50%; pointer-events: none; opacity: 0.7; }

        /* History Badge */
        .badge-scan { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }
        .badge-plan { background: #f1f8e9; color: #33691e; border: 1px solid #dcedc8; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#" onclick="showHome()">👅 TongueCheck Pro</a>
        <button id="btnLogout" class="btn btn-outline-light btn-sm btn-round d-none" onclick="logout()">ออกจากระบบ</button>
    </div>
</nav>

<div class="container py-4">

    <div id="authSection" class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="card p-5 text-center shadow-lg animate__animated animate__fadeIn">
                <h3 class="fw-bold mb-4 text-primary">ลงชื่อเข้าใช้งาน</h3>
                <div id="authError" class="alert alert-danger d-none small"></div>
                <input type="email" id="email" class="form-control mb-3 btn-round" placeholder="อีเมลของคุณ">
                <input type="password" id="password" class="form-control mb-4 btn-round" placeholder="รหัสผ่าน">
                <button class="btn btn-primary w-100 mb-2 btn-round py-3" onclick="handleAuth('login')">เข้าสู่ระบบ</button>
                <button class="btn btn-outline-secondary w-100 btn-round" onclick="handleAuth('signup')">สมัครสมาชิกใหม่</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="d-none">
        <div id="homePage" class="animate__animated animate__fadeIn text-center">
            <h2 class="fw-bold mb-4">ยินดีต้อนรับสู่ศูนย์ดูแลสุขภาพลิ้น</h2>
            <div class="row g-3">
                <div class="col-6 col-md-4"><div class="card p-4 shadow-sm" style="cursor:pointer" onclick="showPage('scan-tab')"><h3>📸</h3><b>สแกนลิ้น</b></div></div>
                <div class="col-6 col-md-4"><div class="card p-4 shadow-sm" style="cursor:pointer" onclick="showPage('plan-tab')"><h3>📅</h3><b>แพลนเนอร์</b></div></div>
                <div class="col-12 col-md-4"><div class="card p-4 shadow-sm" style="cursor:pointer" onclick="showPage('history-tab')"><h3>⏳</h3><b>ดูประวัติทั้งหมด</b></div></div>
            </div>
        </div>

        <div id="pageContent" class="d-none mt-3">
            <button class="btn btn-light btn-round mb-4 shadow-sm" onclick="showHome()">⬅️ กลับเมนูหลัก</button>

            <div class="content-view d-none" id="scan-tab">
                <div class="card p-3 text-center">
                    <div id="video-container">
                        <video id="video" autoplay playsinline></video>
                        <div class="scan-overlay"></div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-secondary btn-round mb-2" onclick="switchCamera()">🔄 สลับกล้องหน้า/หลัง</button><br>
                        <button class="btn btn-danger btn-round px-5 py-3 shadow" onclick="startAIAnalysis()">🔬 วิเคราะห์ลิ้นเดี๋ยวนี้</button>
                    </div>
                    <canvas id="canvas" class="d-none" width="400" height="300"></canvas>
                    <div id="resultOutput" class="mt-4"></div>
                </div>
            </div>

            <div class="content-view d-none" id="plan-tab">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">📅 จัดการตารางสุขภาพ</h5>
                    <div class="input-group mb-4 shadow-sm">
                        <input type="text" id="planInput" class="form-control" placeholder="เช่น แปรงลิ้น, ดื่มน้ำ 8 แก้ว...">
                        <button class="btn btn-primary px-4" onclick="addCustomPlan()">เพิ่มแผน</button>
                    </div>
                    <ul id="planList" class="list-group list-group-flush"></ul>
                </div>
            </div>

            <div class="content-view d-none" id="history-tab">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-primary">⏳ บันทึกกิจกรรมและผลการตรวจ</h5>
                    <div id="historyData">กำลังโหลดประวัติ...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAT_a_mJqgA4BpJAHsdnFG8DbitAWUoLko",
        authDomain: "tonguecheck.firebaseapp.com",
        databaseURL: "https://tonguecheck-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tonguecheck",
        storageBucket: "tonguecheck.firebasestorage.app",
        messagingSenderId: "278288057340",
        appId: "1:278288057340:web:dcc14f73fa8806c0176879"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentStream = null;
    let facingMode = "user";

    // --- Authentication ---
    window.handleAuth = async (type) => {
        const em = document.getElementById('email').value;
        const pw = document.getElementById('password').value;
        const err = document.getElementById('authError');
        try {
            if(type === 'login') await signInWithEmailAndPassword(auth, em, pw);
            else await createUserWithEmailAndPassword(auth, em, pw);
            err.classList.add('d-none');
        } catch (e) {
            err.innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือมีผู้ใช้นี้อยู่แล้ว";
            err.classList.remove('d-none');
        }
    };
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('authSection').classList.add('d-none');
            document.getElementById('mainSection').classList.remove('d-none');
            document.getElementById('btnLogout').classList.remove('d-none');
            syncUserData();
        } else {
            document.getElementById('authSection').classList.remove('d-none');
            document.getElementById('mainSection').classList.add('d-none');
            document.getElementById('btnLogout').classList.add('d-none');
        }
    });

    // --- Navigation ---
    window.showPage = (id) => {
        document.getElementById('homePage').classList.add('d-none');
        document.getElementById('pageContent').classList.remove('d-none');
        document.querySelectorAll('.content-view').forEach(v => v.classList.add('d-none'));
        document.getElementById(id).classList.remove('d-none');
        if(id === 'scan-tab') startCam();
    };
    window.showHome = () => {
        document.getElementById('homePage').classList.remove('d-none');
        document.getElementById('pageContent').classList.add('d-none');
    };

    // --- Camera Control ---
    async function startCam() {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
            const v = document.getElementById('video');
            v.srcObject = currentStream;
            v.className = (facingMode === "user") ? "" : "back-cam";
        } catch (e) { alert("ไม่สามารถเปิดกล้องได้"); }
    }
    window.switchCamera = () => { facingMode = (facingMode === "user") ? "environment" : "user"; startCam(); };

    // --- AI Analysis & Auto History Save ---
    window.startAIAnalysis = () => {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const pixels = ctx.getImageData(150, 100, 100, 100).data;
        let r=0, g=0;
        for(let i=0; i<pixels.length; i+=4) { r+=pixels[i]; g+=pixels[i+1]; }
        const avgR=r/(pixels.length/4), avgG=g/(pixels.length/4);

        let res = { title: "ลิ้นปกติ", type: "success", info: "ลิ้นสีชมพูดูสุขภาพดีมากครับ" };
        if(avgG > 170) res = { title: "พบคราบฝ้าขาว", type: "warning", info: "แนะนำให้ใช้ที่ขูดลิ้นและดื่มน้ำเพิ่มครับ" };
        else if(avgR > 210) res = { title: "ลิ้นแดงอักเสบ", type: "danger", info: "อาจจะขาดวิตามินหรือร้อนใน ควรพักผ่อนครับ" };

        document.getElementById('resultOutput').innerHTML = `
            <div class="alert alert-${res.type} animate__animated animate__fadeInUp shadow-sm">
                <b>ผลตรวจ: ${res.title}</b><br><small>${res.info}</small>
            </div>
        `;

        // SAVE TO HISTORY AUTOMATICALLY
        push(ref(db, `users/${auth.currentUser.uid}/history`), {
            category: "SCAN",
            title: res.title,
            detail: res.info,
            timestamp: new Date().toLocaleString('th-TH')
        });
    };

    // --- Planner & Auto History Save ---
    window.addCustomPlan = () => {
        const task = document.getElementById('planInput').value;
        if(task) {
            const planRef = ref(db, `users/${auth.currentUser.uid}/plans`);
            push(planRef, { task: task });

            // SAVE ACTIVITY TO HISTORY
            push(ref(db, `users/${auth.currentUser.uid}/history`), {
                category: "PLAN",
                title: "เพิ่มแผนใหม่",
                detail: `คุณได้เพิ่มแผน: ${task}`,
                timestamp: new Date().toLocaleString('th-TH')
            });

            document.getElementById('planInput').value = "";
        }
    };

    // --- Sync & Show Data ---
    function syncUserData() {
        onValue(ref(db, `users/${auth.currentUser.uid}`), (snap) => {
            const data = snap.val();
            
            // Planner UI
            const pList = document.getElementById('planList'); pList.innerHTML = "";
            if(data?.plans) Object.entries(data.plans).forEach(([id, p]) => {
                pList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>✅ ${p.task}</span>
                    <button class="btn btn-sm text-danger" onclick="deleteItem('plans/${id}')">ลบ</button>
                </li>`;
            });

            // History UI (All activities)
            const hList = document.getElementById('historyData'); hList.innerHTML = "";
            if(data?.history) {
                Object.entries(data.history).reverse().forEach(([id, h]) => {
                    const badge = h.category === "SCAN" ? "badge-scan" : "badge-plan";
                    hList.innerHTML += `
                        <div class="p-3 mb-2 border-bottom shadow-sm bg-white rounded">
                            <span class="badge ${badge} mb-2">${h.category}</span>
                            <small class="float-end text-muted">${h.timestamp}</small>
                            <div class="fw-bold">${h.title}</div>
                            <div class="text-secondary small">${h.detail}</div>
                        </div>`;
                });
            } else hList.innerText = "ยังไม่มีประวัติกิจกรรม";
        });
    }

    window.deleteItem = (path) => remove(ref(db, `users/${auth.currentUser.uid}/${path}`));
</script>
</body>
</html>
