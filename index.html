<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TongueCheck Pro | AI Health Assistant</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0062ff; --secondary: #7c4dff; --accent: #ffc107; --bg: #f8faff; --card-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        body { font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #2d3436; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .main-card { border-radius: 30px; border: none; box-shadow: var(--card-shadow); background: white; transition: 0.3s ease; }
        .btn-gradient { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 50px; font-weight: 700; padding: 12px 30px; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,98,255,0.4); color: white; }
        
        /* Scanner UI */
        #video-wrap { position: relative; width: 100%; max-width: 450px; border-radius: 35px; overflow: hidden; border: 8px solid white; box-shadow: 0 20px 40px rgba(0,0,0,0.15); margin: auto; }
        #video { width: 100%; background: #000; transform: scaleX(-1); transition: 0.5s; }
        #video.back-cam { transform: scaleX(1); }
        .scan-anim { position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--accent); box-shadow: 0 0 20px var(--accent); animation: moveScan 2.5s infinite linear; z-index: 10; }
        @keyframes moveScan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }

        /* Menu Icons */
        .menu-item { cursor: pointer; padding: 25px; border-radius: 25px; transition: 0.3s; background: white; text-align: center; border: 1px solid transparent; }
        .menu-item:hover { transform: scale(1.05); border-color: var(--primary); box-shadow: var(--card-shadow); }
        .menu-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }

        /* History Cards */
        .hist-card { border-left: 6px solid var(--primary); margin-bottom: 15px; border-radius: 15px !important; }
        .hist-scan { border-color: var(--primary); }
        .hist-plan { border-color: #00c853; }
    </style>
</head>
<body>

<nav class="navbar glass-nav sticky-top shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-800 text-primary" onclick="location.reload()" style="cursor:pointer">
            <i class="bi bi-shield-plus me-2"></i>TongueCheck <span class="text-dark">PRO</span>
        </span>
        <div id="userNav" class="d-none">
            <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> ออกจากระบบ
            </button>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div id="authSection" class="row justify-content-center py-5">
        <div class="col-md-5">
            <div class="main-card p-5 animate__animated animate__fadeInUp">
                <div class="text-center mb-4">
                    <h2 class="fw-800">ยินดีต้อนรับสู่ AI หมอลิ้น</h2>
                    <p class="text-muted">ดูแลสุขภาพง่ายๆ ด้วยปลายนิ้ว</p>
                </div>
                <div id="authErr" class="alert alert-danger d-none animate__animated animate__shakeX"></div>
                <div class="form-floating mb-3">
                    <input type="email" id="email" class="form-control rounded-pill px-4" placeholder="name@example.com">
                    <label class="px-4">อีเมลของคุณ</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" id="password" class="form-control rounded-pill px-4" placeholder="Password">
                    <label class="px-4">รหัสผ่าน</label>
                </div>
                <button class="btn btn-gradient w-100 mb-3 shadow" onclick="authAction('login')">เข้าสู่ระบบ</button>
                <button class="btn btn-link w-100 text-decoration-none text-muted" onclick="authAction('signup')">ยังไม่มีบัญชี? สมัครสมาชิกใหม่</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="d-none">
        
        <div id="homePage" class="animate__animated animate__fadeIn">
            <div class="row mb-5 text-center">
                <div class="col-12">
                    <h1 class="fw-800 mb-2">สวัสดีครับ! สุขภาพลิ้นวันนี้เป็นอย่างไร?</h1>
                    <p class="text-muted">เลือกฟังก์ชันที่คุณต้องการใช้งานด้านล่าง</p>
                </div>
            </div>
            <div class="row g-4 justify-content-center">
                <div class="col-6 col-md-3">
                    <div class="menu-item main-card" onclick="openPage('scan-view')">
                        <i class="bi bi-camera-fill menu-icon text-primary"></i>
                        <span class="fw-bold">วิเคราะห์ลิ้น</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="menu-item main-card" onclick="openPage('plan-view')">
                        <i class="bi bi-calendar-check-fill menu-icon text-success"></i>
                        <span class="fw-bold">แพลนเนอร์</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="menu-item main-card" onclick="openPage('history-view')">
                        <i class="bi bi-clock-history menu-icon text-secondary"></i>
                        <span class="fw-bold">ประวัติบันทึก</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="pageContainer" class="d-none">
            <button class="btn btn-white btn-sm rounded-pill shadow-sm mb-4 px-3" onclick="goHome()">
                <i class="bi bi-arrow-left"></i> กลับหน้าหลัก
            </button>

            <div id="scan-view" class="sub-view d-none">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="main-card p-4 text-center">
                            <div id="video-wrap">
                                <video id="video" autoplay playsinline></video>
                                <div id="scanLine" class="scan-anim d-none"></div>
                            </div>
                            <div class="d-flex justify-content-center gap-2 mt-4">
                                <button class="btn btn-light rounded-pill" onclick="toggleCam()">
                                    <i class="bi bi-arrow-repeat"></i> สลับกล้อง
                                </button>
                                <button class="btn btn-gradient px-5 shadow-lg" onclick="startWinnerAnalysis()">
                                    <i class="bi bi-magic"></i> เริ่มวิเคราะห์เดี๋ยวนี้
                                </button>
                            </div>
                            <canvas id="canvas" class="d-none" width="450" height="350"></canvas>
                            <div id="winnerResult" class="mt-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="plan-view" class="sub-view d-none">
                <div class="main-card p-4">
                    <h4 class="fw-800 mb-4 text-success"><i class="bi bi-calendar-plus me-2"></i>ตารางการดูแลส่วนตัว</h4>
                    <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden">
                        <input type="text" id="taskIn" class="form-control border-0 ps-4" placeholder="เพิ่มแผนใหม่ เช่น ดื่มน้ำอุ่น 1 แก้ว...">
                        <button class="btn btn-success px-4" onclick="addPlannerTask()">เพิ่มแผนงาน</button>
                    </div>
                    <ul id="taskList" class="list-group list-group-flush"></ul>
                </div>
            </div>

            <div id="history-view" class="sub-view d-none">
                <div class="main-card p-4">
                    <h4 class="fw-800 mb-4 text-secondary"><i class="bi bi-activity me-2"></i>ประวัติกิจกรรมย้อนหลัง</h4>
                    <div id="historyFeed"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Your Config
    const firebaseConfig = {
        apiKey: "AIzaSyAT_a_mJqgA4BpJAHsdnFG8DbitAWUoLko",
        authDomain: "tonguecheck.firebaseapp.com",
        databaseURL: "https://tonguecheck-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tonguecheck",
        storageBucket: "tonguecheck.firebasestorage.app",
        messagingSenderId: "278288057340",
        appId: "1:278288057340:web:dcc14f73fa8806c0176879"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let stream = null;
    let mode = "user";

    // --- Authentication Engine ---
    window.authAction = async (type) => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        const errBox = document.getElementById('authErr');
        try {
            if(type === 'login') await signInWithEmailAndPassword(auth, e, p);
            else await createUserWithEmailAndPassword(auth, e, p);
            errBox.classList.add('d-none');
        } catch (err) {
            errBox.innerText = "❌ เกิดข้อผิดพลาด: โปรดตรวจสอบอีเมลและรหัสผ่าน";
            errBox.classList.remove('d-none');
        }
    }
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('authSection').classList.add('d-none');
            document.getElementById('mainSection').classList.remove('d-none');
            document.getElementById('userNav').classList.remove('d-none');
            loadGlobalData();
        } else {
            document.getElementById('authSection').classList.remove('d-none');
            document.getElementById('mainSection').classList.add('d-none');
            document.getElementById('userNav').classList.add('d-none');
        }
    });

    // --- Navigation ---
    window.openPage = (id) => {
        document.getElementById('homePage').classList.add('d-none');
        document.getElementById('pageContainer').classList.remove('d-none');
        document.querySelectorAll('.sub-view').forEach(v => v.classList.add('d-none'));
        document.getElementById(id).classList.remove('d-none');
        if(id === 'scan-view') startVideo();
    }
    window.goHome = () => {
        document.getElementById('homePage').classList.remove('d-none');
        document.getElementById('pageContainer').classList.add('d-none');
        if(stream) stream.getTracks().forEach(t => t.stop());
    }

    // --- High-End AI Analysis & Behavior Logic ---
    async function startVideo() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
        const v = document.getElementById('video');
        v.srcObject = stream;
        v.className = mode === "user" ? "" : "back-cam";
    }
    window.toggleCam = () => { mode = mode === "user" ? "environment" : "user"; startVideo(); }

    window.startWinnerAnalysis = () => {
        document.getElementById('scanLine').classList.remove('d-none');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        setTimeout(() => {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(150, 100, 150, 150).data;
            let r=0, g=0, b=0;
            for(let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; }
            const avgR = r/(data.length/4), avgG = g/(data.length/4), avgB = b/(data.length/4);

            let res = { type: "สดใส (Healthy Pink)", color: "primary", behavior: "ดูแลสุขภาพเยี่ยม", advice: "ลิ้นสีชมพูแสดงถึงระบบหมุนเวียนเลือดและพักผ่อนที่ยอดเยี่ยม" };
            
            if(avgG > 175) res = { type: "สายรีบ (Coated)", color: "warning", behavior: "สายกินจุ/ปาร์ตี้", advice: "พบคราบฝ้าขาวสะสม ควรใช้ที่ขูดลิ้นและดื่มน้ำเพิ่มครับ" };
            else if(avgR > 215) res = { type: "ร้อนแรง (Glossitis)", color: "danger", behavior: "สายเผ็ด/พักน้อย", advice: "ลิ้นแดงผิดปกติ มักเกิดจากอาการร้อนในหรือร่างกายขาดวิตามินบี" };
            else if(avgR < 160 && avgG < 160) res = { type: "อ่อนแรง (Pale)", color: "info", behavior: "สายอดนอน/ซีด", advice: "ลิ้นดูซีดกว่าปกติ อาจเกิดจากสภาวะเลือดจางหรือพักผ่อนน้อย" };

            document.getElementById('winnerResult').innerHTML = `
                <div class="main-card p-4 border-top border-5 border-${res.color} animate__animated animate__zoomIn shadow">
                    <div class="d-flex justify-content-between mb-2">
                        <h4 class="fw-800 text-${res.color}">${res.type}</h4>
                        <span class="badge bg-${res.color} rounded-pill">${res.behavior}</span>
                    </div>
                    <p class="mb-0 text-muted">${res.advice}</p>
                </div>
            `;
            document.getElementById('scanLine').classList.add('d-none');

            // AUTO SAVE EVERYTHING
            const histRef = ref(db, `users/${auth.currentUser.uid}/history`);
            push(histRef, {
                type: 'ANALYSIS',
                title: res.type,
                detail: `พฤติกรรม: ${res.behavior} | ${res.advice}`,
                style: 'hist-scan',
                time: new Date().toLocaleString('th-TH')
            });
        }, 1500);
    }

    // --- Planner & History Engine ---
    window.addPlannerTask = () => {
        const t = document.getElementById('taskIn').value;
        if(!t) return;
        const planRef = ref(db, `users/${auth.currentUser.uid}/plans`);
        push(planRef, { task: t });
        
        // Log to history
        push(ref(db, `users/${auth.currentUser.uid}/history`), {
            type: 'PLANNER',
            title: 'อัปเดตแผนสุขภาพ',
            detail: `คุณได้เพิ่มกิจกรรม: ${t}`,
            style: 'hist-plan',
            time: new Date().toLocaleString('th-TH')
        });
        document.getElementById('taskIn').value = "";
    }

    function loadGlobalData() {
        const userRef = ref(db, `users/${auth.currentUser.uid}`);
        onValue(userRef, (snap) => {
            const data = snap.val();
            
            // Render Planner
            const tList = document.getElementById('taskList'); tList.innerHTML = "";
            if(data?.plans) Object.entries(data.plans).forEach(([id, p]) => {
                tList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-0 px-0">
                    <span class="fw-bold">✨ ${p.task}</span>
                    <button class="btn btn-sm text-danger" onclick="removeItem('plans/${id}')"><i class="bi bi-trash"></i></button>
                </li>`;
            });

            // Render History
            const hList = document.getElementById('historyFeed'); hList.innerHTML = "";
            if(data?.history) {
                Object.entries(data.history).reverse().forEach(([id, h]) => {
                    hList.innerHTML += `
                        <div class="card p-3 mb-3 main-card hist-card ${h.style}">
                            <div class="d-flex justify-content-between mb-1">
                                <small class="text-primary fw-bold">${h.type}</small>
                                <small class="text-muted">${h.time}</small>
                            </div>
                            <div class="fw-800">${h.title}</div>
                            <div class="text-muted small">${h.detail}</div>
                        </div>`;
                });
            } else hList.innerHTML = "<p class='text-center text-muted py-5'>ยังไม่มีประวัติกิจกรรม</p>";
        });
    }

    window.removeItem = (path) => remove(ref(db, `users/${auth.currentUser.uid}/${path}`));
</script>
</body>
</html>
