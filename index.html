<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TongueCheck - ระบบวิเคราะห์สุขภาพช่องปากเบื้องต้น</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Opun+Mai:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p-blue: #0056b3; --d-red: #dc3545; --w-yellow: #ffc107; }
        * { font-family: 'Opun Mai', sans-serif; }
        body { background-color: #f0f2f5; }
        .navbar { background-color: var(--p-blue) !important; border-bottom: 5px solid var(--w-yellow); }
        .card { border-radius: 25px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .btn-round { border-radius: 50px; font-weight: 700; }
        #video-container { position: relative; width: 100%; max-width: 400px; margin: auto; }
        #video { width: 100%; border-radius: 25px; border: 6px solid white; background: #000; }
        .guide-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 160px; height: 200px; border: 4px dashed var(--w-yellow);
            border-radius: 50%; pointer-events: none; opacity: 0.5;
        }
        .nav-link { color: #666; font-weight: bold; border-radius: 15px !important; margin: 0 5px; }
        .nav-link.active { background-color: var(--p-blue) !important; color: white !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="https://img2.pic.in.th/tongueCheck.jpg" height="40" class="me-2 rounded shadow-sm">
            <span>TongueCheck AI</span>
        </a>
        <button id="btnLogout" class="btn btn-outline-light btn-sm btn-round d-none">ออกจากระบบ</button>
    </div>
</nav>

<div class="container pb-5">
    <div id="authSection" class="row justify-content-center">
        <div class="col-md-5 mt-4">
            <div class="card p-5 text-center shadow-lg">
                <h3 class="fw-bold mb-4" style="color: var(--p-blue);">เข้าสู่ระบบ</h3>
                <input type="email" id="email" class="form-control mb-3 btn-round px-4" placeholder="อีเมลของคุณ">
                <input type="password" id="password" class="form-control mb-4 btn-round px-4" placeholder="รหัสผ่าน">
                <button id="btnLogin" class="btn btn-primary w-100 mb-2 btn-round py-3">เข้าสู่ระบบ</button>
                <button id="btnSignUp" class="btn btn-outline-secondary w-100 btn-round">สมัครสมาชิกใหม่</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="d-none">
        <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active shadow-sm" data-bs-toggle="pill" data-bs-target="#scan-tab">📸 วิเคราะห์ลิ้น</button></li>
            <li class="nav-item"><button class="nav-link shadow-sm" data-bs-toggle="pill" data-bs-target="#plan-tab">📅 แพลนเนอร์</button></li>
            <li class="nav-item"><button class="nav-link shadow-sm" data-bs-toggle="pill" data-bs-target="#history-tab">⏳ ประวัติ</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="scan-tab">
                <div class="row justify-content-center">
                    <div class="col-md-6 text-center">
                        <div class="card p-4">
                            <div id="video-container">
                                <video id="video" autoplay playsinline></video>
                                <div class="guide-overlay"></div>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <button id="btnSwitch" class="btn btn-outline-dark flex-grow-1 btn-round">🔄 สลับกล้อง</button>
                                <button id="btnCapture" class="btn btn-danger flex-grow-2 btn-round px-5 shadow">กดวิเคราะห์</button>
                            </div>
                            <canvas id="canvas" class="d-none" width="400" height="300"></canvas>
                            <div id="resultArea" class="mt-4 text-start"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="plan-tab">
                <div class="row justify-content-center">
                    <div class="col-md-7">
                        <div class="card p-4">
                            <h5 class="fw-bold mb-3">📅 ตารางดูแลสุขภาพลิ้นรายวัน</h5>
                            <div class="input-group mb-4">
                                <input type="text" id="planInput" class="form-control" placeholder="เช่น แปรงลิ้นด้วยขนแปรงอ่อน">
                                <button id="btnAddPlan" class="btn btn-primary px-4">เพิ่มแพลน</button>
                            </div>
                            <ul id="planList" class="list-group list-group-flush"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="history-tab">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">ย้อนดูสุขภาพลิ้น</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr><th>วันที่</th><th>ผลวิเคราะห์</th><th>ลักษณะที่ตรวจพบ</th><th>จัดการ</th></tr>
                            </thead>
                            <tbody id="historyBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAT_a_mJqgA4BpJAHsdnFG8DbitAWUoLko",
        authDomain: "tonguecheck.firebaseapp.com",
        databaseURL: "https://tonguecheck-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tonguecheck",
        storageBucket: "tonguecheck.firebasestorage.app",
        messagingSenderId: "278288057340",
        appId: "1:278288057340:web:dcc14f73fa8806c0176879"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentStream = null;
    let cameraMode = "user"; // เริ่มต้นด้วยกล้องหน้า

    // --- ฟังก์ชันสลับกล้อง ---
    async function startCamera() {
        if (currentStream) currentStream.getTracks().forEach(track => track.stop());
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraMode } });
            document.getElementById('video').srcObject = currentStream;
        } catch (e) { alert("ไม่สามารถเปิดกล้องได้"); }
    }

    document.getElementById('btnSwitch').onclick = () => {
        cameraMode = (cameraMode === "user") ? "environment" : "user";
        startCamera();
    };

    // --- ฐานข้อมูลโรคลิ้นและการวิเคราะห์ ---
    function analyzeTongue() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

        let rS = 0, gS = 0, bS = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 100) { rS += data[i]; gS += data[i+1]; bS += data[i+2]; count++; }
        }
        if (count < 800) return { err: "กรุณาจัดลิ้นให้ตรงกรอบ" };

        let avgR = rS / count, avgG = gS / count, avgB = bS / count;
        
        // ข้อมูลจำลองการตัดสินใจของ AI (Rule-based)
        let info = {
            name: "ปกติ",
            symptom: "สีชมพูเรื่อ พื้นผิวขรุขระเล็กน้อย",
            cause: "สุขภาพช่องปากดีเยี่ยม",
            solution: "รักษาความสะอาดสม่ำเสมอ",
            color: "success"
        };

        if (avgG > 175) {
            info = {
                name: "โรคฝ้าขาว (Leukoplakia)",
                symptom: "มีปื้นสีขาวหนาเช็ดไม่ออก",
                cause: "การระคายเคืองเรื้อรัง หรือแบคทีเรียสะสม",
                solution: "แปรงลิ้นด้วยแปรงสีฟันขนอ่อน และพบทันตแพทย์",
                color: "warning"
            };
        } else if (avgR > 215 && avgB < 130) {
            info = {
                name: "ลิ้นสตรอว์เบอร์รี / อักเสบ",
                symptom: "สีแดงจัด มีตุ่มนูนแดงชัดเจน",
                cause: "ร่างกายขาดวิตามิน หรือมีภาวะร้อนในสูง",
                solution: "ดื่มน้ำสะอาด 2 ลิตร/วัน และทานวิตามินเสริม",
                color: "danger"
            };
        } else if (avgB > 150 && avgR < 160) {
            info = {
                name: "ลิ้นสีม่วงคล้ำ / เลือดคั่ง",
                symptom: "ลิ้นมีสีม่วงหรือเขียวคล้ำ",
                cause: "การไหลเวียนเลือดไม่สะดวก หรือขาดออกซิเจน",
                solution: "ควรปรึกษาแพทย์เพื่อตรวจระบบไหลเวียนโลหิต",
                color: "dark"
            };
        }

        return info;
    }

    document.getElementById('btnCapture').onclick = () => {
        const res = analyzeTongue();
        if (res.err) { alert(res.err); return; }

        push(ref(db, `users/${auth.currentUser.uid}/history`), {
            date: new Date().toLocaleString('th-TH'),
            ...res
        });

        document.getElementById('resultArea').innerHTML = `
            <div class="alert alert-${res.color} border-0 shadow-sm p-4">
                <h4 class="fw-bold">${res.name}</h4>
                <hr>
                <p><strong>ลักษณะ:</strong> ${res.symptom}</p>
                <p><strong>สาเหตุ:</strong> ${res.cause}</p>
                <p class="mb-0 text-decoration-underline"><strong>วิธีดูแล:</strong> ${res.solution}</p>
            </div>`;
    };

    // --- ระบบแพลนเนอร์ ---
    document.getElementById('btnAddPlan').onclick = () => {
        const task = document.getElementById('planInput').value;
        if (!task) return;
        push(ref(db, `users/${auth.currentUser.uid}/plans`), { task });
        document.getElementById('planInput').value = "";
    };

    function loadPlanner(uid) {
        onValue(ref(db, `users/${uid}/plans`), (snap) => {
            const list = document.getElementById('planList');
            list.innerHTML = "";
            snap.forEach(c => {
                list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center border-0 mb-2 rounded bg-white shadow-sm">
                    <span>✅ ${c.val().task}</span>
                    <button class="btn btn-sm text-danger" onclick="window.delPlan('${c.key}')">ลบ</button>
                </li>`;
            });
        });
    }

    // --- ระบบสมาชิกและซิงค์ข้อมูล ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authSection').classList.add('d-none');
            document.getElementById('mainSection').classList.remove('d-none');
            document.getElementById('btnLogout').classList.remove('d-none');
            startCamera();
            loadPlanner(user.uid);
            onValue(ref(db, `users/${user.uid}/history`), (snap) => {
                const tbody = document.getElementById('historyBody');
                tbody.innerHTML = "";
                snap.forEach(c => {
                    const d = c.val();
                    tbody.innerHTML += `<tr>
                        <td><small>${d.date}</small></td>
                        <td><span class="badge bg-${d.color}">${d.name}</span></td>
                        <td><small>${d.symptom}</small></td>
                        <td><button class="btn btn-sm text-danger" onclick="window.delHis('${c.key}')">ลบ</button></td>
                    </tr>`;
                });
            });
        } else {
            document.getElementById('authSection').classList.remove('d-none');
            document.getElementById('mainSection').classList.add('d-none');
        }
    });

    window.delHis = (k) => remove(ref(db, `users/${auth.currentUser.uid}/history/${k}`));
    window.delPlan = (k) => remove(ref(db, `users/${auth.currentUser.uid}/plans/${k}`));
    document.getElementById('btnLogin').onclick = () => signInWithEmailAndPassword(auth, email.value, password.value).catch(e => alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง"));
    document.getElementById('btnSignUp').onclick = () => createUserWithEmailAndPassword(auth, email.value, password.value).then(() => alert("สมัครสำเร็จ!")).catch(e => alert(e.message));
    document.getElementById('btnLogout').onclick = () => signOut(auth);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
