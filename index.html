<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TongueCheck Pro AI - ระบบวิเคราะห์และดูแลสุขภาพลิ้น</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --p-blue: #0056b3; --a-yellow: #ffc107; --bg: #f8f9fa; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg); }
        .navbar { background: var(--p-blue) !important; border-bottom: 4px solid var(--a-yellow); }
        .card { border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-round { border-radius: 50px; font-weight: bold; padding: 10px 25px; }
        
        /* Camera UI */
        #video-container { position: relative; width: 100%; max-width: 450px; margin: auto; border-radius: 25px; overflow: hidden; border: 6px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        #video { width: 100%; display: block; background: #000; transform: scaleX(-1); } /* Mirror for front cam */
        #video.back-cam { transform: scaleX(1); }
        .scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 160px; height: 200px; border: 3px dashed var(--a-yellow); border-radius: 50%; pointer-events: none; opacity: 0.7; }

        /* Navigation */
        .nav-link-custom { cursor: pointer; padding: 15px; text-align: center; background: white; border-radius: 15px; transition: 0.3s; margin-bottom: 10px; border: 1px solid #eee; }
        .nav-link-custom:hover { background: #eef2f7; transform: translateY(-3px); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#" onclick="showHome()">👅 TongueCheck Pro</a>
        <button id="btnLogout" class="btn btn-outline-light btn-sm btn-round d-none" onclick="logout()">ออกจากระบบ</button>
    </div>
</nav>

<div class="container py-4">

    <div id="authSection" class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="card p-5 text-center shadow-lg animate__animated animate__fadeIn">
                <h3 class="fw-bold mb-4">ยินดีต้อนรับ</h3>
                <div id="authError" class="alert alert-danger d-none small"></div>
                <input type="email" id="email" class="form-control mb-3 btn-round" placeholder="อีเมล (example@mail.com)">
                <input type="password" id="password" class="form-control mb-4 btn-round" placeholder="รหัสผ่าน">
                <button class="btn btn-primary w-100 mb-2 btn-round py-3" onclick="handleAuth('login')">เข้าสู่ระบบ</button>
                <button class="btn btn-outline-secondary w-100 btn-round" onclick="handleAuth('signup')">สมัครสมาชิกใหม่</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="d-none">
        <div id="homePage" class="animate__animated animate__fadeIn text-center">
            <h2 class="fw-bold mb-4">สวัสดีครับ คุณสุขภาพลิ้นเป็นอย่างไร?</h2>
            <div class="row g-3">
                <div class="col-6 col-md-3"><div class="nav-link-custom shadow-sm" onclick="showPage('scan-tab')"><h3>📸</h3><b>วิเคราะห์ลิ้น</b></div></div>
                <div class="col-6 col-md-3"><div class="nav-link-custom shadow-sm" onclick="showPage('plan-tab')"><h3>📅</h3><b>แพลนเนอร์</b></div></div>
                <div class="col-6 col-md-3"><div class="nav-link-custom shadow-sm" onclick="showPage('history-tab')"><h3>⏳</h3><b>ประวัติบันทึก</b></div></div>
                <div class="col-6 col-md-3"><div class="nav-link-custom shadow-sm" onclick="showPage('chat-tab')"><h3>🤖</h3><b>คุยกับหมอ AI</b></div></div>
            </div>
        </div>

        <div id="pageContent" class="d-none mt-3">
            <button class="btn btn-light btn-round mb-4" onclick="showHome()">⬅️ กลับหน้าหลัก</button>

            <div class="content-view d-none" id="scan-tab">
                <div id="video-container">
                    <video id="video" autoplay playsinline></video>
                    <div class="scan-overlay"></div>
                </div>
                <div class="text-center mt-3">
                    <button class="btn btn-secondary btn-round mb-2" onclick="switchCamera()">🔄 สลับกล้อง (หน้า/หลัง)</button><br>
                    <button class="btn btn-danger btn-round px-5 py-3 shadow-lg" onclick="startAIAnalysis()">🔬 วิเคราะห์สุขภาพลิ้น</button>
                </div>
                <canvas id="canvas" class="d-none" width="400" height="300"></canvas>
                <div id="resultOutput" class="mt-4"></div>
            </div>

            <div class="content-view d-none" id="plan-tab">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">📅 ตารางดูแลสุขภาพลิ้นของคุณ</h5>
                    <div class="input-group mb-3">
                        <input type="text" id="planInput" class="form-control" placeholder="เช่น แปรงลิ้นเช้า-เย็น, ดื่มน้ำเพิ่ม...">
                        <button class="btn btn-primary px-4" onclick="addCustomPlan()">เพิ่ม</button>
                    </div>
                    <ul id="planList" class="list-group list-group-flush"></ul>
                </div>
            </div>

            <div class="content-view d-none" id="history-tab">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">⏳ ประวัติการวิเคราะห์ย้อนหลัง</h5>
                    <div id="historyData">กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAT_a_mJqgA4BpJAHsdnFG8DbitAWUoLko",
        authDomain: "tonguecheck.firebaseapp.com",
        databaseURL: "https://tonguecheck-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tonguecheck",
        storageBucket: "tonguecheck.firebasestorage.app",
        messagingSenderId: "278288057340",
        appId: "1:278288057340:web:dcc14f73fa8806c0176879"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentStream = null;
    let facingMode = "user"; // "user" = front, "environment" = back

    // --- Authentication ---
    window.handleAuth = async (type) => {
        const em = document.getElementById('email').value;
        const pw = document.getElementById('password').value;
        const err = document.getElementById('authError');
        try {
            if(type === 'login') await signInWithEmailAndPassword(auth, em, pw);
            else await createUserWithEmailAndPassword(auth, em, pw);
            err.classList.add('d-none');
        } catch (e) {
            err.innerText = "เกิดข้อผิดพลาด: อีเมลหรือรหัสผ่านไม่ถูกต้อง";
            err.classList.remove('d-none');
        }
    };
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('authSection').classList.add('d-none');
            document.getElementById('mainSection').classList.remove('d-none');
            document.getElementById('btnLogout').classList.remove('d-none');
            syncUserData();
        } else {
            document.getElementById('authSection').classList.remove('d-none');
            document.getElementById('mainSection').classList.add('d-none');
            document.getElementById('btnLogout').classList.add('d-none');
        }
    });

    // --- Navigation ---
    window.showPage = (id) => {
        document.getElementById('homePage').classList.add('d-none');
        document.getElementById('pageContent').classList.remove('d-none');
        document.querySelectorAll('.content-view').forEach(v => v.classList.add('d-none'));
        document.getElementById(id).classList.remove('d-none');
        if(id === 'scan-tab') startCam();
    };
    window.showHome = () => {
        document.getElementById('homePage').classList.remove('d-none');
        document.getElementById('pageContent').classList.add('d-none');
    };

    // --- Camera Control (Front/Back) ---
    async function startCam() {
        if(currentStream) currentStream.getTracks().forEach(track => track.stop());
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
            const v = document.getElementById('video');
            v.srcObject = currentStream;
            v.className = (facingMode === "user") ? "" : "back-cam";
        } catch (e) { alert("เข้าถึงกล้องไม่ได้"); }
    }
    window.switchCamera = () => {
        facingMode = (facingMode === "user") ? "environment" : "user";
        startCam();
    };

    // --- AI Medical Analysis Logic ---
    window.startAIAnalysis = () => {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // RGB Calculation
        const pixels = ctx.getImageData(150, 100, 100, 100).data;
        let r=0, g=0, b=0;
        for(let i=0; i<pixels.length; i+=4) { r+=pixels[i]; g+=pixels[i+1]; b+=pixels[i+2]; }
        const count = pixels.length/4;
        const avgR=r/count, avgG=g/count, avgB=b/count;

        let result = { disease: "ปกติ", status: "success", advice: "ลิ้นสุขภาพดี สีชมพูเรื่อ รักษาวินัยการแปรงลิ้นต่อไปครับ" };

        if(avgG > 170 && avgR > 170) {
            result = { disease: "พบคราบฝ้าขาว (Coated Tongue)", status: "warning", advice: "เกิดจากแบคทีเรียสะสม ควรใช้ที่ขูดลิ้น แปรงลิ้นวันละ 2 ครั้ง และดื่มน้ำให้เพียงพอ" };
        } else if(avgR > 210 && avgG < 150) {
            result = { disease: "ลิ้นแดงผิดปกติ (Glossitis/ร้อนใน)", status: "danger", advice: "อาจเกิดจากการขาดวิตามิน B12 หรือร่างกายร้อนใน ควรทานผักใบเขียว พักผ่อนให้พอ และเลี่ยงอาหารรสจัด" };
        } else if(avgR > 180 && avgG > 180 && avgB > 180) {
            result = { disease: "สงสัยเชื้อราในช่องปาก (Oral Candidiasis)", status: "danger", advice: "พบฝ้าขาวหนาคล้ายนมบูด หากเช็ดไม่ออกและเจ็บ แนะนำให้พบทันตแพทย์เพื่อรับยาฆ่าเชื้อรา" };
        }

        document.getElementById('resultOutput').innerHTML = `
            <div class="card p-4 border-start border-5 border-${result.status} animate__animated animate__fadeInUp">
                <h5 class="fw-bold text-${result.status}">${result.disease}</h5>
                <p class="mb-2"><b>คำแนะนำ:</b> ${result.advice}</p>
                <small class="text-secondary">วิเคราะห์เมื่อ: ${new Date().toLocaleString('th-TH')}</small>
            </div>
        `;

        // Save to Firebase History
        push(ref(db, `users/${auth.currentUser.uid}/history`), {
            date: new Date().toLocaleString('th-TH'),
            disease: result.disease,
            advice: result.advice,
            type: result.status
        });
    };

    // --- Planner & History Data Sync ---
    function syncUserData() {
        const userRef = ref(db, `users/${auth.currentUser.uid}`);
        onValue(userRef, (snap) => {
            const data = snap.val();
            
            // Render Planner
            const pList = document.getElementById('planList'); pList.innerHTML = "";
            if(data?.plans) Object.entries(data.plans).forEach(([id, p]) => {
                pList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>✅ ${p.task}</span>
                    <button class="btn btn-sm text-danger" onclick="deleteItem('plans/${id}')">ลบ</button>
                </li>`;
            });

            // Render History
            const hList = document.getElementById('historyData'); hList.innerHTML = "";
            if(data?.history) {
                Object.entries(data.history).reverse().forEach(([id, h]) => {
                    hList.innerHTML += `<div class="p-3 border-bottom small">
                        <b class="text-primary">${h.date}</b><br>ผลตรวจ: <b>${h.disease}</b><br>
                        <span class="text-muted">${h.advice}</span>
                    </div>`;
                });
            } else hList.innerText = "ยังไม่มีประวัติการบันทึก";
        });
    }

    window.addCustomPlan = () => {
        const val = document.getElementById('planInput').value;
        if(val) {
            push(ref(db, `users/${auth.currentUser.uid}/plans`), { task: val });
            document.getElementById('planInput').value = "";
        }
    };

    window.deleteItem = (path) => remove(ref(db, `users/${auth.currentUser.uid}/${path}`));
</script>
</body>
</html>
